name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    if: false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: xianni_game
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx drizzle-kit push
        env:
          DB_CONNECTION_STRING: postgresql://postgres@localhost:5432/xianni_game

      - name: Unit & Integration tests
        run: |
          npm run dev &
          npx wait-on http://localhost:3000
          npm test
        env:
          DB_CONNECTION_STRING: postgresql://postgres@localhost:5432/xianni_game
          JWT_SECRET: ci-test-secret

      - name: E2E tests
        run: npm run test:e2e
        env:
          DB_CONNECTION_STRING: postgresql://postgres@localhost:5432/xianni_game
          JWT_SECRET: ci-test-secret
